name: Deploy sito su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica i file statici
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Attendi disponibilità dell'artefatto Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..18}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || true)
            if [ "$count" = "1" ]; then
              echo "Artefatto github-pages disponibile."
              exit 0
            fi
            echo "Artefatto non ancora disponibile (tentativo $attempt/18)."
            sleep 5
          done
          echo "::error::Artefatto github-pages non disponibile o duplicato."
          exit 1

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
